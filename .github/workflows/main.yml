name: Build Wizarding World Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build mod
        run: gradle clean build --no-daemon

      - name: Verify mod JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q '^fabric.mod.json$'
          echo "Built: $JAR"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: WizardingWorldFabric-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
