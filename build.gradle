plugins {
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}
repositories { }

loom {
    splitEnvironmentSourceSets()
    mods {
        "wizardingworld" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}


// PACKED WIZARDING WORLD RESOURCES
// Keep the source repository small: unpack item models, textures, language
// files, and Fabric metadata from one ZIP when Gradle builds the mod.
def packedResourcesZip = layout.projectDirectory.file("wizardingworld-resources.zip")
def unpackedResourcesDir = layout.buildDirectory.dir("generated/packedResources")

tasks.register("unpackPackedResources", Copy) {
    from { zipTree(packedResourcesZip) }
    into unpackedResourcesDir
}

sourceSets {
    main {
        resources.srcDir(unpackedResourcesDir)
    }
}

tasks.named("processResources") {
    dependsOn(tasks.named("unpackPackedResources"))
}
